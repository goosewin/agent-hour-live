<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Motoring Coffee — Order</title>
<style>
  :root {
    --bg: #12100e; --card: #1c1917; --line: #2e2926;
    --text: #f5f0ea; --dim: #a39a90; --accent: #e0a878; --good: #7fd1a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.5 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  header { margin-bottom: 22px; }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  header p { color: var(--dim); font-size: 14px; margin-top: 3px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: block; margin-bottom: 6px; }
  select, input {
    width: 100%; background: #16130f; color: var(--text); font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font-family: inherit; appearance: none;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .grow { flex: 1; min-width: 0; }
  .qty { width: 86px; flex: none; }
  button {
    font: 600 15px inherit; border-radius: 10px; padding: 13px 16px;
    border: 1px solid var(--line); background: #24201c; color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #211609; border-color: var(--accent); width: 100%; }
  button.ghost { background: none; color: var(--dim); font-weight: 500; padding: 8px 0; border: 0; }
  .tips { display: flex; gap: 8px; }
  .tips button { flex: 1; padding: 11px 0; text-align: center; }
  .tips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .totals { font-variant-numeric: tabular-nums; }
  .totals .line { display: flex; justify-content: space-between; padding: 7px 0; color: var(--dim); font-size: 15px; }
  .totals .line.total {
    color: var(--text); font-size: 20px; font-weight: 650;
    border-top: 1px solid var(--line); margin-top: 6px; padding-top: 13px;
  }
  .lines li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; list-style: none; }
  .lines li:last-child { border-bottom: 0; }
  .lines .x { color: var(--dim); background: none; border: 0; font-size: 20px; padding: 0 4px; cursor: pointer; }
  .empty { color: var(--dim); font-size: 14px; text-align: center; padding: 10px 0; }
  footer { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 22px; line-height: 1.6; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Motoring Coffee</h1>
  <p>1525 Union St · order ahead</p>
</header>

<div class="card">
  <div class="row">
    <div class="grow">
      <label for="item">Drink</label>
      <select id="item"></select>
    </div>
    <div class="qty">
      <label for="qty">Qty</label>
      <input id="qty" type="number" value="1" inputmode="numeric" />
    </div>
  </div>
  <div class="row">
    <div class="grow">
      <label for="size">Size</label>
      <select id="size"></select>
    </div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="primary" id="add">Add to order</button>
  </div>
</div>

<div class="card">
  <label>Your order</label>
  <ul class="lines" id="lines"></ul>
</div>

<div class="card">
  <label>Tip</label>
  <div class="tips" id="tips"></div>
</div>

<div class="card totals" id="totals"></div>

<footer>
  Something look wrong? <a href="/phone" id="reportLink">Tell us →</a>
</footer>

<script type="module">
import { MENU, SIZES, lineTotal, orderTotal, round } from "./src/pricing.ts";

const $ = (id) => document.getElementById(id);
let lines = [];
let tipPercent = 18;

for (const [key, spec] of Object.entries(MENU)) {
  $("item").add(new Option(`${spec.label} — $${spec.base.toFixed(2)}`, key));
}
for (const [key, spec] of Object.entries(SIZES)) {
  $("size").add(new Option(spec.label, key));
}

$("tips").innerHTML = [0, 15, 18, 22].map((p) =>
  `<button data-tip="${p}" aria-pressed="${p === tipPercent}">${p}%</button>`
).join("");

$("tips").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  tipPercent = Number(btn.dataset.tip);
  [...$("tips").children].forEach((b) => b.setAttribute("aria-pressed", b === btn));
  render();
});

$("add").addEventListener("click", () => {
  lines.push({ item: $("item").value, size: $("size").value, qty: Number($("qty").value) });
  render();
});

$("lines").addEventListener("click", (e) => {
  const btn = e.target.closest(".x");
  if (!btn) return;
  lines.splice(Number(btn.dataset.i), 1);
  render();
});

function render() {
  if (!lines.length) {
    $("lines").innerHTML = `<li class="empty">Nothing added yet.</li>`;
  } else {
    $("lines").innerHTML = lines.map((l, i) => {
      let amount;
      try {
        amount = `$${round(lineTotal(l.item, l.size, l.qty)).toFixed(2)}`;
      } catch (err) {
        amount = "—";
      }
      return `<li><span>${l.qty} × ${SIZES[l.size].label} ${MENU[l.item].label}</span>
        <span>${amount} <button class="x" data-i="${i}" aria-label="remove">×</button></span></li>`;
    }).join("");
  }

  let t;
  try {
    t = orderTotal(lines, tipPercent);
  } catch (err) {
    $("totals").innerHTML = `<div class="line total"><span>Total</span><span>error</span></div>`;
    return;
  }
  $("totals").innerHTML = `
    <div class="line"><span>Subtotal</span><span>$${t.subtotal.toFixed(2)}</span></div>
    <div class="line"><span>Tax</span><span>$${t.tax.toFixed(2)}</span></div>
    <div class="line"><span>Tip (${tipPercent}%)</span><span>$${t.tip.toFixed(2)}</span></div>
    <div class="line total"><span>Total</span><span>$${t.total.toFixed(2)}</span></div>`;
}

render();
</script>
</body>
</html>
